name: MLB Scorecard Daily Auto Post

on:
  schedule:
    # ── 00:01 AM PST: 당일 경기 예측 & 홈페이지 초기 업데이트 ──
    - cron: '1 8 * * *'    # 00:01 PST — daily_init (예측만, 포스팅 없음)

    # ── 매시간 실행 (PST 오전 6시 ~ 자정) ──
    # PST = UTC-8, 따라서:
    - cron: '0 14 * * *'   # 06:00 PST (결과 포스팅)
    - cron: '0 15 * * *'   # 07:00 PST
    - cron: '0 16 * * *'   # 08:00 PST
    - cron: '0 17 * * *'   # 09:00 PST
    - cron: '0 18 * * *'   # 10:00 PST
    - cron: '0 19 * * *'   # 11:00 PST
    - cron: '0 20 * * *'   # 12:00 PST
    - cron: '0 21 * * *'   # 13:00 PST
    - cron: '0 22 * * *'   # 14:00 PST
    - cron: '0 23 * * *'   # 15:00 PST
    - cron: '0 0 * * *'    # 16:00 PST
    - cron: '0 1 * * *'    # 17:00 PST
    - cron: '0 2 * * *'    # 18:00 PST
    - cron: '0 3 * * *'    # 19:00 PST
    - cron: '0 4 * * *'    # 20:00 PST
    - cron: '0 5 * * *'    # 21:00 PST
    - cron: '0 6 * * *'    # 22:00 PST
    - cron: '0 7 * * *'    # 23:00 PST

  workflow_dispatch:
    inputs:
      date:
        description: '날짜 (YYYY-MM-DD), 비우면 오늘 PST'
        required: false
      mode:
        description: '실행 모드: prediction (기본) 또는 results'
        required: false
        default: 'prediction'

jobs:
  check_and_post:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install chromium --with-deps

      - name: 날짜 & 모드 설정
        id: config
        run: |
          # PST 기준 날짜
          TZ='America/Los_Angeles'
          PST_HOUR=$(TZ='America/Los_Angeles' date +%H)
          PST_DATE=$(TZ='America/Los_Angeles' date +%Y-%m-%d)
          YESTERDAY=$(TZ='America/Los_Angeles' date -d "yesterday" +%Y-%m-%d 2>/dev/null || TZ='America/Los_Angeles' date -v-1d +%Y-%m-%d)

          # 수동 실행이면 입력값 사용
          if [ -n "${{ github.event.inputs.date }}" ]; then
            RUN_DATE="${{ github.event.inputs.date }}"
          else
            RUN_DATE="$PST_DATE"
          fi

          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "$PST_HOUR" = "00" ]; then
            # 자정 00:01 = 당일 예측 초기화 (홈페이지 업데이트만, SNS 포스팅 없음)
            MODE="daily_init"
          elif [ "$PST_HOUR" = "06" ]; then
            # 오전 6시 = 결과 포스팅 (전날 결과)
            MODE="results"
            RUN_DATE="$YESTERDAY"
          else
            MODE="prediction"
          fi

          echo "RUN_DATE=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "MODE=$MODE" >> $GITHUB_OUTPUT
          echo "✅ 날짜: $RUN_DATE | 모드: $MODE | PST시각: $PST_HOUR시"

      - name: 당일 예측 초기화 (daily_init — 00:01 PST, 홈페이지만 업데이트)
        if: steps.config.outputs.MODE == 'daily_init'
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
        run: |
          echo "🌙 00:01 PST — 당일 경기 예측 초기화 시작 (${{ steps.config.outputs.RUN_DATE }})"
          python src/scorecard_pipeline.py ${{ steps.config.outputs.RUN_DATE }}
          echo "✅ 예측 완료 — SNS 포스팅 없음, 홈페이지만 업데이트"

      - name: 스마트 포스팅 체크 & 실행 (prediction / results 모드)
        if: steps.config.outputs.MODE != 'daily_init'
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          if [ "${{ steps.config.outputs.MODE }}" = "results" ]; then
            python src/check_and_post.py --date ${{ steps.config.outputs.RUN_DATE }} --results
          else
            python src/check_and_post.py --date ${{ steps.config.outputs.RUN_DATE }}
          fi

      - name: 웹 레포 체크아웃 (항상)
        uses: actions/checkout@v4
        with:
          repository: michaelkim618/mlb-scorecard-web
          token: ${{ secrets.WEB_REPO_PAT }}
          path: mlb-scorecard-web

      - name: news.json 업데이트 (항상)
        run: |
          python src/fetch_news.py mlb-scorecard-web

      - name: season_results.json 업데이트 (결과 모드)
        if: steps.config.outputs.MODE == 'results'
        run: |
          python src/update_season_results.py mlb-scorecard-web

      - name: predictions.json 업데이트 (항상 - 라인업 확정 반영)
        run: |
          if [ -f output/predictions.json ]; then
            cp output/predictions.json mlb-scorecard-web/public/predictions.json
            echo "✅ predictions.json 복사 완료"
          else
            echo "⚠️  output/predictions.json 없음 — 스킵"
          fi

      - name: 전날 파이프라인 실행 (결과 모드 — 블로그 데이터 준비)
        if: steps.config.outputs.MODE == 'results'
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
        run: |
          echo "📊 블로그용 ${{ steps.config.outputs.RUN_DATE }} 데이터 생성 중..."
          python src/scorecard_pipeline.py ${{ steps.config.outputs.RUN_DATE }} || echo "⚠️ 파이프라인 실패 (계속 진행)"

      - name: 블로그 포스트 자동 생성 (결과 모드)
        if: steps.config.outputs.MODE == 'results'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
        run: |
          python src/generate_blog_post.py --date ${{ steps.config.outputs.RUN_DATE }} --web-repo mlb-scorecard-web || echo "블로그 생성 실패 (계속 진행)"

      - name: 웹 레포 커밋 & 푸시 (항상)
        working-directory: mlb-scorecard-web
        run: |
          git config user.name "MLB Scorecard Bot"
          git config user.email "bot@mlb-scorecard.com"
          git add public/news.json public/season_results.json public/predictions.json public/blog/
          git diff --staged --quiet || git commit -m "📊 Auto-update: ${{ steps.config.outputs.RUN_DATE }} (${{ steps.config.outputs.MODE }})"
          git push
