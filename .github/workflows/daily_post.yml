name: MLB Scorecard Daily Auto Post

on:
  schedule:
    # ── 00:01 AM PST: 당일 경기 예측 & 홈페이지 초기 업데이트 ──
    - cron: '1 8 * * *'    # 00:01 PST — daily_init (예측만, 포스팅 없음)

    # ── 30분 간격 실행 (PST 오전 6시 ~ 자정) ──
    # PST = UTC-8, 따라서:
    - cron: '0 14 * * *'   # 06:00 PST (결과 포스팅)
    - cron: '30 14 * * *'  # 06:30 PST
    - cron: '0 15 * * *'   # 07:00 PST
    - cron: '30 15 * * *'  # 07:30 PST
    - cron: '0 16 * * *'   # 08:00 PST
    - cron: '30 16 * * *'  # 08:30 PST
    - cron: '0 17 * * *'   # 09:00 PST
    - cron: '30 17 * * *'  # 09:30 PST
    - cron: '0 18 * * *'   # 10:00 PST
    - cron: '30 18 * * *'  # 10:30 PST
    - cron: '0 19 * * *'   # 11:00 PST
    - cron: '30 19 * * *'  # 11:30 PST
    - cron: '0 20 * * *'   # 12:00 PST
    - cron: '30 20 * * *'  # 12:30 PST
    - cron: '0 21 * * *'   # 13:00 PST
    - cron: '30 21 * * *'  # 13:30 PST
    - cron: '0 22 * * *'   # 14:00 PST
    - cron: '30 22 * * *'  # 14:30 PST
    - cron: '0 23 * * *'   # 15:00 PST
    - cron: '30 23 * * *'  # 15:30 PST
    - cron: '0 0 * * *'    # 16:00 PST
    - cron: '30 0 * * *'   # 16:30 PST
    - cron: '0 1 * * *'    # 17:00 PST
    - cron: '30 1 * * *'   # 17:30 PST
    - cron: '0 2 * * *'    # 18:00 PST
    - cron: '30 2 * * *'   # 18:30 PST
    - cron: '0 3 * * *'    # 19:00 PST
    - cron: '30 3 * * *'   # 19:30 PST
    - cron: '0 4 * * *'    # 20:00 PST
    - cron: '30 4 * * *'   # 20:30 PST
    - cron: '0 5 * * *'    # 21:00 PST
    - cron: '30 5 * * *'   # 21:30 PST
    - cron: '0 6 * * *'    # 22:00 PST
    - cron: '30 6 * * *'   # 22:30 PST
    - cron: '0 7 * * *'    # 23:00 PST
    - cron: '30 7 * * *'   # 23:30 PST

  workflow_dispatch:
    inputs:
      date:
        description: '날짜 (YYYY-MM-DD), 비우면 오늘 PST'
        required: false
      mode:
        description: '실행 모드: prediction (기본) 또는 results'
        required: false
        default: 'prediction'

concurrency:
  group: mlb-daily-post
  cancel-in-progress: false   # 실행 중인 잡을 취소하지 않고 새 잡이 기다림

jobs:
  check_and_post:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install chromium --with-deps

      - name: 날짜 & 모드 설정
        id: config
        run: |
          PST_HOUR=$(TZ='America/Los_Angeles' date +%H)
          PST_DATE=$(TZ='America/Los_Angeles' date +%Y-%m-%d)
          YESTERDAY=$(TZ='America/Los_Angeles' date -d "yesterday" +%Y-%m-%d 2>/dev/null || TZ='America/Los_Angeles' date -v-1d +%Y-%m-%d)

          if [ -n "${{ github.event.inputs.date }}" ]; then
            RUN_DATE="${{ github.event.inputs.date }}"
          else
            RUN_DATE="$PST_DATE"
          fi

          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "$PST_HOUR" = "00" ]; then
            MODE="daily_init"
          elif [ "$PST_HOUR" = "06" ]; then
            # 새벽 6시: 전날 최종 결과 포스팅 (SNS 포함)
            MODE="results"
            RUN_DATE="$YESTERDAY"
          else
            MODE="prediction"
          fi

          echo "RUN_DATE=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "MODE=$MODE" >> $GITHUB_OUTPUT
          echo "✅ 날짜: $RUN_DATE | 모드: $MODE | PST시각: $PST_HOUR시"

      # ── 웹 레포 체크아웃 (앞으로 이동 — predictions.json 복원 & 커밋 모두 여기서) ──
      - name: 웹 레포 체크아웃 (항상)
        uses: actions/checkout@v4
        with:
          repository: michaelkim618/mlb-scorecard-web
          token: ${{ secrets.WEB_REPO_PAT }}
          path: mlb-scorecard-web

      # ── daily_init: 당일 예측 초기화 ──
      - name: 당일 예측 초기화 (daily_init — 00:01 PST, 홈페이지만 업데이트)
        if: steps.config.outputs.MODE == 'daily_init'
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
        run: |
          echo "🌙 00:01 PST — 당일 경기 예측 초기화 시작 (${{ steps.config.outputs.RUN_DATE }})"
          python src/scorecard_pipeline.py ${{ steps.config.outputs.RUN_DATE }}
          echo "✅ 예측 완료 — SNS 포스팅 없음, 홈페이지만 업데이트"

      # ── prediction / results 모드: 포스팅 ──

      - name: 포스팅 상태 & predictions.json 복원 (웹 레포 git — 신뢰성 보장)
        if: steps.config.outputs.MODE != 'daily_init'
        run: |
          mkdir -p output/post_state

          # ① post_state: 웹 레포 git에서 복원 (캐시보다 신뢰성 높음)
          STATE_FILE="mlb-scorecard-web/public/post_state_${{ steps.config.outputs.RUN_DATE }}.json"
          if [ -f "$STATE_FILE" ]; then
            cp "$STATE_FILE" "output/post_state/posted_${{ steps.config.outputs.RUN_DATE }}.json"
            echo "✅ post_state 복원 완료 (웹 레포에서)"
          else
            echo "ℹ️  post_state 없음 (첫 실행)"
          fi

          # ② predictions.json 복원
          if [ -f mlb-scorecard-web/public/predictions.json ]; then
            cp mlb-scorecard-web/public/predictions.json output/predictions.json
            echo "✅ predictions.json 복원 완료"
          else
            echo "⚠️  predictions.json 없음 — 파이프라인으로 새로 생성 예정"
          fi

      - name: 스마트 포스팅 체크 & 실행 (prediction / results 모드)
        if: steps.config.outputs.MODE != 'daily_init'
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          if [ "${{ steps.config.outputs.MODE }}" = "results" ]; then
            python src/check_and_post.py --date ${{ steps.config.outputs.RUN_DATE }} --results
          else
            python src/check_and_post.py --date ${{ steps.config.outputs.RUN_DATE }}
          fi

      - name: 포스팅 상태 저장 (웹 레포 git — 중복 포스팅 방지)
        if: steps.config.outputs.MODE != 'daily_init'
        run: |
          STATE_SRC="output/post_state/posted_${{ steps.config.outputs.RUN_DATE }}.json"
          STATE_DST="mlb-scorecard-web/public/post_state_${{ steps.config.outputs.RUN_DATE }}.json"
          if [ -f "$STATE_SRC" ]; then
            cp "$STATE_SRC" "$STATE_DST"
            echo "✅ post_state → 웹 레포 저장 완료"
          else
            echo "ℹ️  post_state 파일 없음 (포스팅 없었음)"
          fi

      # ── 웹 데이터 업데이트 (항상) ──

      - name: news.json 업데이트 (항상)
        run: |
          python src/fetch_news.py mlb-scorecard-web

      # ── 결과 모드: 전날 파이프라인을 season_results 업데이트 전에 실행 ──
      - name: 전날 파이프라인 실행 (결과 모드 — season_results 업데이트 전 선행)
        if: steps.config.outputs.MODE == 'results'
        env:
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
        run: |
          echo "📊 ${{ steps.config.outputs.RUN_DATE }} 결과 데이터 생성 중 (update_season_results 선행)..."
          python src/scorecard_pipeline.py ${{ steps.config.outputs.RUN_DATE }} || echo "⚠️ 파이프라인 실패 (계속 진행)"

      - name: season_results.json 실시간 업데이트 (항상 — 경기 종료 즉시 반영)
        run: |
          # MLB API + predictions.json 병합으로 당일/전날 경기 결과 반영
          # 30분마다 실행되므로 경기 종료 후 최대 30분 내 Accuracy 반영
          python src/update_season_results.py mlb-scorecard-web || echo "⚠️ season_results 업데이트 실패 (계속 진행)"

      - name: predictions.json 업데이트 (항상 - 라인업 확정 반영)
        run: |
          if [ -f output/predictions.json ]; then
            cp output/predictions.json mlb-scorecard-web/public/predictions.json
            echo "✅ predictions.json 복사 완료"
          else
            echo "⚠️  output/predictions.json 없음 — 스킵"
          fi

      - name: 블로그 포스트 자동 생성 (결과 모드)
        if: steps.config.outputs.MODE == 'results'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPORTS_DATA_API_KEY: ${{ secrets.SPORTS_DATA_API_KEY }}
        run: |
          python src/generate_blog_post.py --date ${{ steps.config.outputs.RUN_DATE }} --web-repo mlb-scorecard-web || echo "블로그 생성 실패 (계속 진행)"

      - name: 웹 레포 커밋 & 푸시 (항상)
        working-directory: mlb-scorecard-web
        run: |
          git config user.name "MLB Scorecard Bot"
          git config user.email "bot@mlb-scorecard.com"

          # 7일 이상 된 post_state 파일 정리
          find public -name "post_state_*.json" -mtime +7 -delete 2>/dev/null || true

          git add public/news.json public/season_results.json public/predictions.json public/blog/ public/post_state_*.json || true
          git diff --staged --quiet || git commit -m "📊 Auto-update: ${{ steps.config.outputs.RUN_DATE }} (${{ steps.config.outputs.MODE }})"
          git pull --rebase && git push
